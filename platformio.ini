; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit Unified Sensor@^1.1.15
	kosme/arduinoFFT@^2.0.4
	h2zero/NimBLE-Arduino @ ^2.3.6
	bblanchon/ArduinoJson@^7.4.2
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions_tilauambiant_8mb.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_port = /dev/cu.usbmodem101
build_flags = 
	-Os
	-DNDEBUG
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
	-DARDUINO_USB_CDC_ON_BOOT=0

[platformio]
description = Ambiant temperature probe for Artisan Roaster (ESP32-S3 N16R8)

; ---------------------------------------------------------------------------
; ESP32-WROOM-32D (ESP32 V4, dual-mode WiFi+BT) — sonde AUDIO UNIQUEMENT
;   -DTILAU_AUDIO_ONLY : pas de BME280, BLE n'expose que la caractéristique audio.
;   Pins I2S INMP441 (cf. monaudio.h) : WS=25, SCK=33, SD=32, L/R=GND.
;   LED de statut : LED simple onboard GPIO2 (monochrome).
; ---------------------------------------------------------------------------
[env:wroom32d]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	kosme/arduinoFFT@^2.0.4
	h2zero/NimBLE-Arduino @ ^2.3.6
	bblanchon/ArduinoJson@^7.4.2
monitor_speed = 115200
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
upload_speed = 921600
build_flags =
	-Os
	-DNDEBUG
	-DCORE_DEBUG_LEVEL=0
	-DTILAU_AUDIO_ONLY
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
	-DARDUINO_USB_CDC_ON_BOOT=0
