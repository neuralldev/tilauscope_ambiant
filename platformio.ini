; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Reglages communs aux deux boards S3. Volontairement SANS monitor_port /
; upload_port : chaque env nomme (ou pas) son propre port, sinon le devtest
; herite du port de la sonde de roast.
[s3_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit Unified Sensor@^1.1.15
	h2zero/NimBLE-Arduino @ ^2.3.6
	bblanchon/ArduinoJson@^7.4.2
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions_tilauambiant_8mb.csv
board_build.filesystem = littlefs
upload_speed = 921600
; PSRAM octale (N8R8) : décommenter LES DEUX lignes ensemble pour que les gros
; tableaux de calibration (3 x ~15 ko) partent en SPIRAM au lieu de la heap
; interne (cf. calibAlloc() dans monaudio.cpp). Change le mode flash/PSRAM du
; bootloader -> à valider sur banc avant de le mettre sur la sonde de roast.
;board_build.arduino.memory_type = qio_opi
build_flags =
	-Os
	-DNDEBUG
	-DCORE_DEBUG_LEVEL=0
;	-DBOARD_HAS_PSRAM
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
	-DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------------
; Sonde de roast.
; ---------------------------------------------------------------------------
[env:esp32s3]
extends = s3_base
; Port USB JTAG/serial natif du S3 (303A:1001) : OK pour le flash, mais avec
; ARDUINO_USB_CDC_ON_BOOT=0 la sortie `Serial` part sur UART0 -> pont CH343
; (1A86:*). Flash par l'USB natif, monitor par le CH343.
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem5C390170181

; ---------------------------------------------------------------------------
; Banc de test dédié — second ESP32-S3 (micro monté), jamais la sonde de roast.
;   -DTILAU_AUDIO_STREAM : streame le signal brut (pré-filtre) sur l'UART en
;   frames binaires de taille fixe (magic FA CE 17 42 + 128 x PCM16 + checksum,
;   261 octets, sans champ longueur), en plus
;   des logs texte habituels. Voir tools/bench_capture.py.
;   Bascule aussi le baud runtime à 921600 (nécessaire pour tenir le débit) ;
;   la sonde de roast (env esp32s3) reste à 115200, inchangée.
;   Aucun port fixe ici : auto-détection par défaut. Avec les deux boards
;   branchés, passer -p / --upload-port explicitement — ne PAS reprendre le
;   monitor_port de [env:esp32s3], qui désigne l'autre board.
; ---------------------------------------------------------------------------
[env:esp32s3_devtest]
extends = s3_base
monitor_speed = 921600
build_flags =
	${s3_base.build_flags}
	-DTILAU_AUDIO_STREAM

[platformio]
description = Ambiant temperature probe for Artisan Roaster (ESP32-S3 N8R8)

; ---------------------------------------------------------------------------
; ESP32-WROOM-32D (ESP32 V4, dual-mode WiFi+BT) — sonde AUDIO UNIQUEMENT
;   -DTILAU_AUDIO_ONLY : pas de BME280, BLE n'expose que la caractéristique audio.
;   Pins I2S ICS-43434 (cf. monaudio.h) : WS=25, SCK=33, SD=32, L/R=GND.
;   LED de statut : LED simple onboard GPIO2 (monochrome).
; ---------------------------------------------------------------------------
[env:wroom32d]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	h2zero/NimBLE-Arduino @ ^2.3.6
	bblanchon/ArduinoJson@^7.4.2
monitor_speed = 115200
board_build.flash_mode = dio
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
upload_speed = 921600
build_flags =
	-Os
	-DNDEBUG
	-DCORE_DEBUG_LEVEL=0
	-DTILAU_AUDIO_ONLY
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
	-DARDUINO_USB_CDC_ON_BOOT=0
