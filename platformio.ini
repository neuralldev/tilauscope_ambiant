; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit Unified Sensor@^1.1.15
	kosme/arduinoFFT@^2.0.4
	h2zero/NimBLE-Arduino @ ^2.3.6
	bblanchon/ArduinoJson@^7.4.2
monitor_speed = 115200

; ── Flash & partitions ──────────────────────────────────────
board_build.flash_size    = 4MB
board_build.flash_mode    = dio
board_build.partitions    = partitions_tilauambiant.csv
 
; Filesystem LittleFS (calibration audio, logs)
board_build.filesystem    = littlefs
; ── Upload ──────────────────────────────────────────────────
upload_speed   = 921600
; Port série : ajuster selon l'environnement
; macOS UART0 : /dev/cu.usbserial-XXXX  (Serial.printf)
; macOS debug : /dev/cu.debug-console   (ESP_LOGI — port debug natif)
; monitor_port = /dev/cu.usbserial-0001
; ── Optimisation taille ─────────────────────────────────────
; -Os  : optimisation taille (au lieu de -O2 par défaut)
; -DNDEBUG : désactive les assert() (économise ~20 KB)
build_flags =
    -Os
    -DNDEBUG
    -DCORE_DEBUG_LEVEL=0
    ; NimBLE : désactiver les features non utilisées
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
    ; LittleFS
 

[platformio]
description = Ambiant temperature probe for Artisan Roaster
