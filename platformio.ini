; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ════════════════════════════════════════════════════════════════════
; Cible : ESP32-S3-WROOM-1-N16R8 (Sparkle IoT XH-S3E DevKitC-1)
;   - 16 MB flash (N16) + 8 MB PSRAM octale (R8)
;   - Flasher / monitorer via le port USB-C "USB to serial" (CH343p)
; ════════════════════════════════════════════════════════════════════
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit Unified Sensor@^1.1.15
	kosme/arduinoFFT@^2.0.4
	h2zero/NimBLE-Arduino @ ^2.3.6
	bblanchon/ArduinoJson@^7.4.2
; Serial.begin(115200) côté firmware -> garder le monitor aligné
monitor_speed = 115200

; ── Flash & PSRAM (N8R8 : 8 Mo flash + 8 Mo PSRAM octale) ────
; ⚠️ Carte vendue "N16R8" mais flash réelle = 8 Mo (vérifié esptool flash_id).
board_build.flash_size          = 8MB
board_build.flash_mode          = dio
; PSRAM réactivée après confirmation du boot -> décommenter la ligne suivante :
; board_build.arduino.memory_type = qio_opi
board_build.partitions          = partitions_tilauambiant_8mb.csv

; Filesystem LittleFS (calibration audio, logs)
board_build.filesystem    = littlefs
; ── Upload ──────────────────────────────────────────────────
upload_speed   = 921600
; Port série : le CH343 « USB to serial » s'énumère en usbmodem sur ce Mac
; (le port usbmodem natif du S3 reste muet car ARDUINO_USB_CDC_ON_BOOT=0).
; ⚠️ Le suffixe macOS (101) peut changer entre rebranchements -> ajuster si besoin.
monitor_port = /dev/cu.usbmodem101
; ── Optimisation taille ─────────────────────────────────────
; -Os  : optimisation taille (au lieu de -O2 par défaut)
; -DNDEBUG : désactive les assert() (économise ~20 KB)
build_flags =
    -Os
    -DNDEBUG
    -DCORE_DEBUG_LEVEL=0
    ; NimBLE : désactiver les features non utilisées
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
    ; PSRAM octale — DÉSACTIVÉE le temps du diagnostic boot (réactiver ensuite)
    ; -DBOARD_HAS_PSRAM
    ; Serial.printf -> UART0 (port CH343), pas l'USB-CDC natif du S3
    -DARDUINO_USB_CDC_ON_BOOT=0

; NOTE : on reste sur espressif32 6.x (Arduino-ESP32 2.0.x, IDF 4.4) -> API I2S
; LEGACY (driver/i2s.h), qui fonctionne sur le S3. Ne PAS utiliser driver/i2s_std.h
; (absent en core 2.x). Pour passer un jour au core 3.x / I2S std, basculer sur
; le fork pioarduino :
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip

[platformio]
description = Ambiant temperature probe for Artisan Roaster (ESP32-S3 N16R8)
